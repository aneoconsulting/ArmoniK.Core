name: Manual Test

# Temporary stress workflow (branch jg/lucid-newton-8zkpft-stress, not meant to be merged):
# runs the tests fixed in PR #1383 in a loop on the Windows runner, for the PR branch and for main.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter for tests'
        default: 'FullyQualifiedName~ExceptionManagerTests.ErrorStop|FullyQualifiedName~ExceptionManagerTests.FatalStop|FullyQualifiedName~ExceptionManagerTests.SelfTerminationDelayStop|FullyQualifiedName~PollsterTest.ExecuteTaskThatExceedsGraceDelayShouldResubmit|FullyQualifiedName~PollsterTest.BatchShouldBeProcessedSequentiallyWhenPrefetchDisabled'
        type: string
      iterations:
        description: 'Number of iterations'
        default: '50'
        type: string

jobs:
  stressWinOnly:
    strategy:
      matrix:
        ref:
          - jg/lucid-newton-8zkpft
          - main
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}

      - name: Install .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.404

      - name: Dotnet Build
        run: |
          cd Common/tests
          dotnet build

      - name: Run tests in a loop
        shell: bash
        env:
          filter: ${{ inputs.filter }}
          iterations: ${{ inputs.iterations }}
        run: |
          cd Common/tests
          mkdir -p "$GITHUB_WORKSPACE/stress"
          failedIterations=0
          for i in $(seq 1 "$iterations"); do
            log="$GITHUB_WORKSPACE/stress/iteration-$i.log"
            start=$(date +%s)
            if dotnet test --no-build --filter "$filter" --logger "console;verbosity=normal" -p:RunAnalyzers=false -p:WarningLevel=0 > "$log" 2>&1; then
              status=ok
              rm "$log"
            else
              status=FAILED
              failedIterations=$((failedIterations + 1))
            fi
            echo "iteration $i: $status ($(( $(date +%s) - start ))s)"
          done
          {
            echo "## ${{ matrix.ref }}: $failedIterations failed iterations out of $iterations"
            echo
            echo '```'
            cat "$GITHUB_WORKSPACE"/stress/*.log 2>/dev/null | grep -E '^\s+Failed ' | sed -E 's/ \[[^]]*\]$//' | sort | uniq -c || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload failed iteration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stress-${{ strategy.job-index }}
          path: stress/
          if-no-files-found: ignore
