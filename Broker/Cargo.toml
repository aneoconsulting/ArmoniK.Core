[package]
name = "armonik-broker"
version = "0.1.0"
edition = "2024"

# Only the criterion targets are benchmarks: libtest would reject criterion's options.
[lib]
bench = false

[[bin]]
name = "armonik-broker"
path = "src/main.rs"
bench = false

[features]
# Alternative hasher of the hot-path tables, at most one; foldhash without any (src/hashing.rs).
hash-sip = []
hash-fx = ["dep:rustc-hash"]
hash-ahash = ["dep:ahash"]

[dependencies]
ahash = { version = "0.8.12", optional = true }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
foldhash = "0.2.0"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service"] }
mimalloc = { version = "0.1.52", default-features = false }
rand = "0.10.3"
rustc-hash = { version = "2.1.3", optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
bytes = "1.12.1"
criterion = "0.8.2"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
proptest = "1.11.0"
tower = { version = "0.5.3", features = ["util"] }

# Confinement of the HTTP bench threads to processors.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.189"

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "http"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
